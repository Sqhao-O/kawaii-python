name: Publish GitHub preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run catalog:check
      - run: npm audit
      - run: python scripts/release-audit.py
      - run: npm run package
      - run: python scripts/release-audit.py --vsix artifacts/kawaii-python-diagnostics-0.1.0.vsix
      - name: Prepare checksums
        run: |
          cd artifacts
          sha256sum kawaii-python-diagnostics-0.1.0.vsix > SHA256SUMS.txt
      - name: Publish audited VSIX and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release create "v$version" \
            "artifacts/kawaii-python-diagnostics-$version.vsix" \
            artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Kawaii Python Diagnostics $version (Preview)" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
